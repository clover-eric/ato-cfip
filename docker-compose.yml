services:
  ato-cfip:
    image: ghcr.io/clover-eric/ato-cfip:latest
    container_name: ato-cfip
    restart: unless-stopped
    ports:
      - "${CFST_WEB_PORT:-8080}:8080"
    environment:
      TZ: Asia/Shanghai
      CFST_DOMAIN: best.example.com
      CFST_PUBLISH_MODE: file
      CFST_CF_API_TOKEN: ""
      CFST_CF_ZONE_ID: ""
    volumes:
      - ato-cfip-config:/config
      - ato-cfip-data:/data
    command:
      - sh
      - -c
      - |
        set -eu
        : "${CFST_DOMAIN:=best.example.com}"
        : "${CFST_PUBLISH_MODE:=file}"
        : "${CFST_CF_API_TOKEN:=}"
        : "${CFST_CF_ZONE_ID:=}"
        if [ ! -f /config/config.yaml ]; then
          cat > /config/config.yaml <<EOF
        server:
          run_on_start: true
          schedule: "0 * * * *"
          timezone: "Asia/Shanghai"

        web:
          enabled: true
          listen: ":8080"
          title: "CFST 优选节点"

        test:
          rounds_per_hour: 10
          desired_unique_ips: 10
          max_extra_rounds: 30
          ip_file: "ip.txt"
          ip_text: ""
          ipv6: false
          all_ip: false
          port: 443
          url: "https://cf.xiu2.xyz/url"
          delay_threads: 200
          ping_times: 4
          download_time_seconds: 10
          download_candidates: 10
          min_delay_ms: 0
          max_delay_ms: 9999
          max_loss_rate: 1.0
          min_speed_mb: 0.01
          httping: false
          httping_status_code: 0
          cfcolo: ""

        publish:
          mode: "${CFST_PUBLISH_MODE}"
          domain: "${CFST_DOMAIN}"
          ttl: 60
          output_file: "/data/best_ips.json"
          hosts_file: "/data/hosts.txt"
          cloudflare:
            api_token: "${CFST_CF_API_TOKEN}"
            zone_id: "${CFST_CF_ZONE_ID}"
            proxied: false

        storage:
          history_path: "/data/results.jsonl"
          keep_days: 30

        log:
          verbose: true
        EOF
        fi
        exec /app/cfst-daemon -config /config/config.yaml

volumes:
  ato-cfip-config:
  ato-cfip-data:
